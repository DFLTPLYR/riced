[package]
name = "riced"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14.0", features = [
  "tokio",
  "advanced",
  "wgpu",
  "tiny-skia",
  "image",
  "svg",
  "canvas",
  "wayland",
] }
iced_runtime = "0.14.0"
# Enables Frame::draw_image in both wgpu and tiny-skia backends (used by the
# settings display map to paint wallpaper previews on canvas).
iced_renderer = { version = "0.14.0", features = ["image"] }
# Header-only native-size lookup for wallpaper entries without width/height.
image = "0.25"
# Decoded RGBA bytes for pre-warmed wallpaper Handles.
bytes = "1"
iced_exwlshell = "0.20.1"
tracing-subscriber = "0.3.23"
tracing-log = "0.2"
iced_wayland_subscriber = "0.20.1"
wayland-client = "0.31.15"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
clap = { version = "4", features = ["derive"] }
