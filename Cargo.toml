[package]
name = "riced"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14.0", features = [
  "tokio",
  "advanced",
  "wgpu",
  "tiny-skia",
  "image",
  "svg",
  "canvas",
  "wayland",
] }
lucide-iced = "0.4.0"
iced_runtime = "0.14.0"
iced_renderer = { version = "0.14.0", features = ["image"] }
image = "0.25"
bytes = "1"
iced_exwlshell = "0.20.1"
tracing-subscriber = "0.3.23"
tracing-log = "0.2"
iced_wayland_subscriber = "0.20.1"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
material-colors = { version = "0.4", features = ["image", "serde"] }
regex = "1"
include_dir = "0.7"
toml = "0.8"
dirs = "6"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["time", "rt"] }
rfd = "0.15"
mlua = { version = "0.12", features = ["lua54", "vendored", "send", "macros", "serialize"] }
tracing = "0.1"
sysinfo = "0.33"
aura-anim = "0.3"
zbus = "5"
