[package]
name = "riced-extension-sdk"
version = "0.1.0"
edition = "2024"

[features]
process = ["dep:tokio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", optional = true, features = ["rt", "time", "sync", "process", "io-util", "macros"] }
